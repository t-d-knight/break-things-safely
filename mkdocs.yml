site_name: Break Things Safely
site_url: https://breakthingssafely.com
site_description: A free cyber security learning pathway — for anyone from a work experience student to a curious colleague.
repo_url: https://github.com/t-d-knight/break-things-safely
edit_uri: edit/main/docs/
copyright: Personal opinions, not endorsements or hiring advice — just things that seemed handy, updated whenever there's spare time to do it.

theme:
  name: material
  custom_dir: overrides
  font: false
  favicon: assets/favicon.svg
  logo: assets/favicon.svg
  palette:
    - scheme: slate
      primary: black
      accent: green
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy

extra_css:
  - stylesheets/terminal.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Start Here:
      - Welcome: index.md
      - Protect Yourself First: protect-yourself.md
      - Five Things to Try: start-here.md
  - Learn the Basics:
      - Get the Foundations: foundations.md
      - Get Hands-On: hands-on.md
      - Build Your Own Lab: build-a-lab.md
      - Learn to Investigate: investigate.md
      - Security Tools We Use: tools.md
      - Cyber & IT Glossary: glossary.md
  - Think Like a Pro:
      - Think Like a Security Person: think-like-a-pro.md
      - Stay Current: stay-current.md
      - Build Evidence, Not Certificates: build-evidence.md
  - Where This Goes:
      - "You Don't Have to Start With Cyber": dont-have-to-start-with-cyber.md
      - Career Paths: career-paths.md
      - Landing Your First Role: first-job.md
      - Find Your People: community.md
      - Take It Further: further-study.md
  - If It Goes Wrong: if-something-goes-wrong.md
  - Family & Friends: protecting-family.md
  - Keep Going: keep-going.md
  - Thanks: thanks.md
